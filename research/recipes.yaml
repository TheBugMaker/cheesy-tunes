cheese:
  Paneer:
    ingredients:
      - milk
      - acid
    process:
      - Heating (milk -> heated milk)
      - Coagulation (acid + heated milk -> curd-and-whey mixture)
      - Separation (curd-and-whey mixture -> curds + whey)
      - Draining (curds -> drained curds)
      - Pressing (drained curds -> Paneer)
  Cream cheese:
    ingredients:
      - milk
      - salt
      - bacteria culture
    process:
      - Heating (milk -> heated milk)
      - Bacterial fermentation (bacteria culture + heated milk -> soft curds)
      - Cutting (soft curds -> cut curds)
      - Draining (cut soft curds -> drained soft curds)
      - Pressing (drained soft curds -> Cream cheese)
  Comte:
    ingredients:
      - milk
      - bacteria culture
      - rennet
      - salt
    process:
      - Heating (milk -> heated milk)
      - Bacterial fermentation (bacteria culture + heated milk -> soft curd)
      - Coagulation (rennet + soft curd -> comte curd)
      - Cutting (comte curd -> cut comte curds)
      - Heating (cut comte curds -> cooked comte curds)
      - Draining (cooked comte curds -> drained comte curds)
      - Pressing (drained comte curds -> pressed comte curds)
      - Ripening (pressed comte curds + salt -> comte)
  Mozzarella:
    ingredients:
      - milk
      - acid
      - rennet
      - salt
    process:
      - Heating (milk -> heated milk)
      - Coagulation (acid + heated milk -> curd-and-whey mixture)
      - Separation (curd-and-whey mixture -> curds + whey)
      - Coagulation (rennet + curd -> rennet curd)
      - Cutting (rennet curd -> cut rennet curds)
      - Draining (cut rennet curds -> drained rennet curds)
      - Ripening (drained rennet curds -> ripe curds)
      - Cutting (ripe curds -> cut ripe curds)
      - Heating (cut ripe curds -> mozzarella curds)
      - Salting (mozzarella curds + salt -> mozzarella)
  Brie:
    ingredients:
      - milk
      - salt
      - rennet
      - bacteria culture
      - white mold
    process:
      - Heating (milk -> heated milk)
      - Bacterial fermentation (bacteria culture + heated milk -> soft curd)
      - Inoculation (white mold + soft curd -> inoculated curd)
      - Coagulation (rennet + inoculated curd -> white moldy curd)
      - Cutting (white moldy curd -> cut white moldy curds)
      - Draining (cut white moldy curds -> drained white moldy curds)
      - Salting (drained white moldy curds + salt -> Brie curd)
      - Ripening (Brie curd -> Brie)
  Roquefort:
    ingredients:
      - milk
      - salt
      - rennet
      - bacteria culture
      - blue mold
    process:
      - Heating (milk -> heated milk)
      - Bacterial fermentation (bacteria culture + heated milk -> soft curd)
      - Inoculation (blue mold + soft curd -> inoculated curd)
      - Coagulation (rennet + inoculated curd -> blue moldy curd)
      - Cutting (blue moldy curd -> cut blue moldy curds)
      - Draining (cut blue moldy curds -> drained blue moldy curds)
      - Salting (drained blue moldy curds + salt -> Roquefort curd)
      - Forming (Roquefort curd -> Roquefort curd wheels)
      - Injecting (Roquefort curd wheels -> Roquefort wheels)
      - Ripening (Roquefort wheels -> Roquefort)
  Taleggio:
    ingredients:
      - milk
      - bacteria culture
      - rennet
      - salt
      - wine
    process:
      - Heating (milk -> heated milk)
      - Bacterial fermentation (bacteria culture + heated milk -> soft curd)
      - Coagulation (rennet + soft curd -> taleggio curd)
      - Cutting (taleggio curd -> cut taleggio curds)
      - Draining (cut taleggio curds -> drained taleggio curds)
      - Salting (drained taleggio curds + salt -> salted taleggio curds)
      - Ripening (salted taleggio curds -> young taleggio)
      - Washing (young taleggio + wine -> washed taleggio)
      - Ripening (washed taleggio -> taleggio)
