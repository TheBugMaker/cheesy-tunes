processes:
  - Heating
  - Acid coagulation
  - Bacterial fermentation
  - Separation
  - Draining
  - Pressing
  - Cutting
ingredients:
  raw materials:
    - milk
    - acid (vinegar)
    - salt
    - bacteria culture
    - rennet
    - white mold
    - blue mold
    - wine
  processed materials:
    - heated milk
    - curd-and-whey mixture
    - curds
    - whey
    - drained curds
    - soft curd
    - cut soft curds
    - drained soft curds
cheese:
  Paneer:
    ingredients:
      - milk
      - acid
    process:
      1. Heating (milk -> heated milk)
      2. Acid coagulation (acid + heated milk -> curd-and-whey mixture)
      3. Separation (curd-and-whey mixture -> curds + whey)
      4. Draining (curds -> drained curds)
      5. Pressing (drained curds -> Paneer)
  Cream cheese:
    ingredients:
      - milk
      - salt
      - bacteria culture
    process:
      1. Heating (milk -> heated milk)
      2. Bacterial fermentation (bacteria culture + heated milk -> soft curd)
      3. Cutting (soft curd -> cut curds)
      4. Draining (cut soft curds -> drained soft curds)
      5. Pressing (drained soft curds -> Cream cheese)
